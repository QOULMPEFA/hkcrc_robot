<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Control Panel</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-role="{{ role }}">
  <header>
    <h1>Robot Control Panel</h1>
    <div id="conn-badge" class="badge disconnected">Disconnected</div>

    <!-- Layout selector -->
    <div class="layout-controls">
      <select id="layout-selector" title="切换布局">
        <option value="">— 选择布局 —</option>
      </select>
      <button id="btn-layout-save" class="btn-secondary btn-sm" title="保存当前布局">保存</button>
      <button id="btn-layout-delete" class="btn-secondary btn-sm" title="删除当前布局">删除</button>
    </div>

    <button id="btn-estop" class="btn-estop">EMERGENCY STOP</button>
    <button id="btn-reboot" class="btn-power btn-reboot" title="重启系统">&#x21bb; 重启</button>
    <button id="btn-shutdown" class="btn-power btn-shutdown" title="关闭系统">&#x23fb; 关机</button>

    <div class="header-user">
      <span class="badge role-badge role-{{ role }}">{{ role }}</span>
      <span class="username">{{ current_user.username }}</span>
      {% if role == 'admin' %}
      <button id="btn-settings" class="btn-icon" title="系统设置">&#9881;</button>
      {% endif %}
      <a href="/logout" class="btn-secondary btn-sm">登出</a>
    </div>
  </header>

  <!-- ── Dashboard ──────────────────────────────────────────────────────── -->
  <div class="dashboard">
    <main class="canvas" id="canvas">
      <!-- panels are created dynamically by app.js -->
    </main>

    <aside class="sidebar" id="sidebar">
      <!-- ── Hardware List ──────────────────────────────────────────── -->
      <div class="sidebar-section">
        <h3>硬件模块</h3>
        <div class="module-list" id="module-list">
          <!-- populated dynamically -->
        </div>
      </div>

      <!-- ── Quick Actions ──────────────────────────────────────────── -->
      <div class="sidebar-section">
        <h3>快捷操作</h3>
        <div class="sidebar-actions">
          <button id="btn-open-all" class="btn-secondary btn-sm" style="width:100%">全部打开</button>
          <button id="btn-close-all" class="btn-secondary btn-sm" style="width:100%">全部关闭</button>
        </div>
      </div>
    </aside>
  </div>

  <footer>
    <span id="last-update">—</span>
  </footer>

  <!-- ── Settings Modal (admin only) ──────────────────────────────────── -->
  {% if role == 'admin' %}
  <div id="settings-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2>&#9881; 系统设置</h2>
        <button id="btn-settings-close" class="btn-icon" aria-label="关闭">&#10005;</button>
      </div>

      <!-- Lift zero & limits -->
      <section class="modal-section">
        <h3>升降平台 — 零点 &amp; 限位</h3>
        <div class="settings-info">
          零点偏移：<b id="lift-zero-offset">—</b> mm &nbsp;|&nbsp;
          当前限位：<b id="lift-limit-min">—</b> ~ <b id="lift-limit-max">—</b> mm
        </div>
        <div class="input-row">
          <label>最小高度 (mm)
            <input type="number" id="lift-min-mm" min="-9999" max="9999" step="1" value="0" />
          </label>
          <label>最大高度 (mm)
            <input type="number" id="lift-max-mm" min="-9999" max="9999" step="1" value="500" />
          </label>
        </div>
        <div class="btn-row">
          <button class="btn-primary"   id="btn-lift-set-zero">将当前位置设为零点</button>
          <button class="btn-secondary" id="btn-lift-set-limits">应用限位</button>
        </div>
      </section>

      <!-- Camera timeout -->
      <section class="modal-section">
        <h3>摄像头 — 自动关闭</h3>
        <div class="input-row">
          <label>无活动超时 (分钟)
            <input type="number" id="camera-timeout" min="1" max="120" step="1" value="5" />
          </label>
        </div>
        <div class="btn-row">
          <button class="btn-primary" id="btn-save-camera-timeout">保存</button>
        </div>
      </section>

      <!-- User management -->
      <section class="modal-section">
        <h3>用户管理</h3>
        <table class="user-table" id="user-table">
          <thead>
            <tr><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody id="user-table-body"></tbody>
        </table>
      </section>
    </div>
  </div>
  {% endif %}

  <!-- Power confirmation modal -->
  <div id="power-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal power-modal">
      <div class="modal-header">
        <h2 id="power-title">&#x26a0; 确认操作</h2>
        <button id="btn-power-cancel" class="btn-icon" aria-label="关闭">&#10005;</button>
      </div>
      <p id="power-msg" style="text-align:center; padding:20px; font-size:16px;"></p>
      <div class="btn-row center">
        <button id="btn-power-cancel2" class="btn-secondary">取消</button>
        <button id="btn-power-confirm" class="btn-estop">确认</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/static/flv.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
