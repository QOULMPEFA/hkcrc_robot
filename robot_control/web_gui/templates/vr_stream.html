<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="xr-spatial-tracking" content="true">
<title>VR Stream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  img {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    image-rendering: auto;
  }
  #status {
    position: fixed; bottom: 16px; left: 16px;
    color: rgba(255,255,255,0.5); font: 12px monospace;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<img id="stream" src="" alt="Camera stream" />
<div id="status">connecting...</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const device = params.get("device") || "cam0";
  const url = "/stream/" + encodeURIComponent(device);
  const img = document.getElementById("stream");
  const status = document.getElementById("status");
  let errorCount = 0;
  const MAX_ERRORS = 10;

  function load() {
    const ts = Date.now();
    img.src = url + "?ts=" + ts;
  }

  img.onload = function() {
    errorCount = 0;
    status.textContent = device + " | " + new Date().toLocaleTimeString();
    // Preload next frame immediately
    requestAnimationFrame(load);
  };

  img.onerror = function() {
    errorCount++;
    status.textContent = device + " | error " + errorCount + "/" + MAX_ERRORS
      + " | " + new Date().toLocaleTimeString();
    if (errorCount < MAX_ERRORS) {
      setTimeout(load, 1000);
    } else {
      status.textContent = device + " | stream lost — check camera";
    }
  };

  load();
</script>
</body>
</html>
