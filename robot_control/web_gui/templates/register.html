<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 — Robot Control Panel</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Robot Control Panel</h1>
    <h2>注册账号</h2>

    {% if success %}
    <div class="auth-alert ok">
      注册成功！您的账号正在等待管理员审批，审批通过后即可登录。
    </div>
    <p class="auth-footer"><a href="/login">返回登录</a></p>
    {% else %}

    {% if error %}
    <div class="auth-alert error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <label>用户名
        <input type="text" name="username" autocomplete="username" required autofocus />
      </label>
      <label>密码
        <input type="password" name="password" autocomplete="new-password" required />
      </label>
      <label>确认密码
        <input type="password" name="confirm" autocomplete="new-password" required />
      </label>
      <button type="submit" class="btn-primary btn-full">注册</button>
    </form>

    <p class="auth-footer">已有账号？<a href="/login">登录</a></p>
    {% endif %}
  </div>
</body>
</html>
