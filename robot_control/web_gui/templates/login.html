<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — Robot Control Panel</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Robot Control Panel</h1>
    <h2>登录</h2>

    {% if msg == 'pending' %}
    <div class="auth-alert warn">账号正在等待管理员审批，请稍后再试。</div>
    {% endif %}
    {% if msg == 'relogin' %}
    <div class="auth-alert warn">您的账号已在其他设备登录，当前会话已失效。</div>
    {% endif %}
    {% if error %}
    <div class="auth-alert error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <label>用户名
        <input type="text" name="username" autocomplete="username" required autofocus />
      </label>
      <label>密码
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn-primary btn-full">登录</button>
    </form>

    <p class="auth-footer">没有账号？<a href="/register">注册</a></p>
  </div>
</body>
</html>
