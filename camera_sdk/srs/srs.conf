# SRS 6 config — WebRTC low-latency streaming + FRP port-proxy
# Public domain: frp-fit.com  (used for RTC candidate)
# ── FRP port mapping (Sakura FRP) ────────────────────────────────────
#   UDP 35500 -> 8000   (WebRTC media)
#   TCP 35900 -> 1985   (HTTP API / signaling)
#   TCP 35700 -> 8080   (HTTP server / console + player)
# ── Local push ────────────────────────────────────────────────────────
#   RTMP 1935 (local only — not exposed via FRP)
#   ffmpeg -f v4l2 -i /dev/video0 -c:v libx264 -f flv rtmp://localhost/live/cam

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

#═══════════════════════════════════════════════════════════════════════
# HTTP API — used by WHIP/WHEP signaling and external integration
#═══════════════════════════════════════════════════════════════════════
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

#═══════════════════════════════════════════════════════════════════════
# HTTP Server — built-in player console + static files
#═══════════════════════════════════════════════════════════════════════
http_server {
    enabled         on;
    listen          8080;
}

#═══════════════════════════════════════════════════════════════════════
# WebRTC (RTC) Server — media plane
# ⚠ 监听端口必须与 FRP 公网 UDP 端口一致 (35500)，否则 SDP candidate 端口会错误
#═══════════════════════════════════════════════════════════════════════
rtc_server {
    enabled         on;
    listen          35500;                    # UDP — 与 FRP 公网端口一致
    # ── 关键 FRP 穿透配置 ────────────────────────────────────────────
    # 向浏览器 SDP 宣告公网域名，SRS 自动使用 listen 端口
    candidate       frp-fit.com;
    api_as_candidates   off;                  # 不把 API 端口当 candidate
    protocol        udp;
}

#═══════════════════════════════════════════════════════════════════════
# Default VHost — 所有流入流默认使用此配置
#═══════════════════════════════════════════════════════════════════════
vhost __defaultVhost__ {
    # WebRTC 发布/订阅
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    # HTTP-FLV remux — 降级方案（不支持原生 WebRTC 的环境）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS — 点播回放 / 高延迟降级
    hls {
        enabled     off;
    }
}
