# SRS 6 config — WebRTC low-latency streaming (local network, no FRP)
# Access: http://<pi-ip>:8080 (console), http://<pi-ip>:1985 (API)
# WebRTC UDP: <pi-ip>:8000

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
}

rtc_server {
    enabled         on;
    listen          8000;
    protocol        udp;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled     off;
    }
}
